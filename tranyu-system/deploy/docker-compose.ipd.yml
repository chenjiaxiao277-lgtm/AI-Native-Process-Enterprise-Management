services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tranyu-postgres
    restart: always
    environment:
      POSTGRES_DB: tranyu_platform
      POSTGRES_USER: tranyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - tranyu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranyu -d tranyu_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: tranyu-redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - tranyu_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: ../tranyu-backend
      dockerfile: Dockerfile
    container_name: tranyu-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tranyu_platform
      SPRING_DATASOURCE_USERNAME: tranyu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"

  frontend:
    build:
      context: ../tranyu-frontend
      dockerfile: Dockerfile
    container_name: tranyu-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "18002:80"

volumes:
  tranyu_postgres_data:
  tranyu_redis_data:
