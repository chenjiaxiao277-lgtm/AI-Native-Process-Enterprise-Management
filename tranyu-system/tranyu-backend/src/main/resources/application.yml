server:
  port: 8080

spring:
  application:
    name: tranyu-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/tranyu_platform}
    username: ${SPRING_DATASOURCE_USERNAME:tranyu}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:16379}
      database: ${SPRING_REDIS_DATABASE:0}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

flowable:
  async-executor-activate: false
  database-schema-update: true
  history-level: full
  process:
    definition-cache-limit: 100

logging:
  level:
    root: info
    org.flywaydb: info
    org.flowable: info
    com.tranyu: debug

tranyu:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-dev}
