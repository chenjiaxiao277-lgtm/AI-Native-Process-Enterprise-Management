server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tranyu-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ltc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# Flowable 7.0.1：复用同一数据源（默认 ltc_db），开启历史，关闭异步执行器（可选）
flowable:
  async-executor-activate: false
  database-schema-update: true
  history-level: full
  process:
    definition-cache-limit: 100

logging:
  level:
    root: info

